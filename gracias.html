<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gracias | Notaría Pública 101</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/brands.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f9fafb;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 3rem;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1f2937;
            margin-bottom: 1rem;
        }
        p {
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
        }
        .urgent-message {
            margin-top: 2rem;
            font-weight: 500;
        }
        .contact-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
            margin-bottom: 2rem;
        }
        .btn {
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-call {
            background-color: #374151;
        }
        .btn-call:hover {
            background-color: #4b5563;
        }
        .btn-whatsapp {
            background-color: #25D366;
        }
        .btn-whatsapp:hover {
            background-color: #1EAE54;
        }
        .home-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #374151;
            text-decoration: none;
            font-weight: 500;
        }
        .home-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>¡Gracias por tu mensaje!</h1>
        <p>Hemos recibido tu consulta y nos pondremos en contacto contigo a la brevedad.</p>
        <p class="urgent-message">Si tu asunto es urgente, no dudes en contactarnos directamente:</p>
        <div class="contact-buttons">
            <a href="tel:+529988871055" class="btn btn-call">
                <i class="fas fa-phone"></i>
                Llamar ahora
            </a>
            <a href="https://wa.me/529988871055" target="_blank" class="btn btn-whatsapp">
                <i class="fab fa-whatsapp"></i>
                Enviar WhatsApp
            </a>
        </div>
        <a href="index.html" class="home-link">Volver a la página principal</a>
    </div>
</body>
</html>
